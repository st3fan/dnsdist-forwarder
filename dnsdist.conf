-- Listen for plain DNS clients on all interfaces.
setLocal('0.0.0.0:53', {reusePort=true})
addLocal('[::]:53', {reusePort=true})

-- Allow queries from anywhere; restrict via container networking instead.
setACL({'0.0.0.0/0', '::/0'})

-- Preferred upstream: DNS-over-TLS (port 853) -> pool 'dot'
newServer({address='8.8.8.8:853',         tls='openssl', subjectName='dns.google',         validateCertificates=true, pool='dot', name='google-dot-1'})
newServer({address='8.8.4.4:853',         tls='openssl', subjectName='dns.google',         validateCertificates=true, pool='dot', name='google-dot-2'})
newServer({address='1.1.1.1:853',         tls='openssl', subjectName='cloudflare-dns.com', validateCertificates=true, pool='dot', name='cloudflare-dot-1'})
newServer({address='1.0.0.1:853',         tls='openssl', subjectName='cloudflare-dns.com', validateCertificates=true, pool='dot', name='cloudflare-dot-2'})

-- Fallback upstream: DNS-over-HTTPS (port 443, /dns-query) -> pool 'doh'
newServer({address='8.8.8.8:443',         tls='openssl', subjectName='dns.google',         dohPath='/dns-query', validateCertificates=true, pool='doh', name='google-doh-1'})
newServer({address='8.8.4.4:443',         tls='openssl', subjectName='dns.google',         dohPath='/dns-query', validateCertificates=true, pool='doh', name='google-doh-2'})
newServer({address='1.1.1.1:443',         tls='openssl', subjectName='cloudflare-dns.com', dohPath='/dns-query', validateCertificates=true, pool='doh', name='cloudflare-doh-1'})
newServer({address='1.0.0.1:443',         tls='openssl', subjectName='cloudflare-dns.com', dohPath='/dns-query', validateCertificates=true, pool='doh', name='cloudflare-doh-2'})

setServerPolicy(leastOutstanding)

-- Prefer DoT; fall back to DoH only when no DoT server is up. Health checks
-- mark a blocked port 'down' within ~1-2 s, so this rule flips automatically.
addAction(PoolAvailableRule('dot'), PoolAction('dot'))
addAction(AllRule(),                PoolAction('doh'))

-- Cache shared across both pools so a flip doesn't invalidate cached answers.
pc = newPacketCache(10000, {maxTTL=86400, minTTL=0, temporaryFailureTTL=60, staleTTL=60})
getPool('dot'):setCache(pc)
getPool('doh'):setCache(pc)
